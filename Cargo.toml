[workspace]
resolver = "2"
members = [
    "crates/zenvu-compiler",
    "crates/zenvu-cli",
    "crates/zenvu-server",
    "crates/zenvu-plugin",
    "crates/zenvu-security",
    "crates/zenvu-guard",
    "crates/zenvu-ai",
    "crates/zenvu-build",
    "crates/zenvu-test",
    "crates/zenvu-docgen"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zenvu.js Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.28", features = ["full"] }
tracing = "0.1"
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = "0.3"
futures = "0.3"
